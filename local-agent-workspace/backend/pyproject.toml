[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-agent-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "regex==2026.9.10", "mcp==2.2.0", "httpx2>=2.5,<3", "jsonschema>=4.26,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
# Browser tests for the frontend (frontend/tests); no Node.js involved.
ui-test = ["pytest>=8,<10", "playwright>=1.50,<2"]
# Static checks used by CI (python -m ruff check --select F,E9 backend frontend/tests scripts).
lint = ["ruff>=0.16,<1"]

[tool.hatch.build.targets.wheel]
packages = ["local_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
