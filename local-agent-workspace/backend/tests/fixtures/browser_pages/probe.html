<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Probe</title></head>
<body>
<h1>Probe</h1>
<p id="out">pending</p>
<script>
const results = [];
const tries = [
  ['own', '/secret.txt'],
  ['loopback', 'http://127.0.0.1:{{OTHER_PORT}}/secret.txt'],
  ['metadata', 'http://169.254.169.254/latest/meta-data/'],
];
Promise.all(tries.map(([name, url]) =>
  fetch(url).then((r) => r.text()).then((t) => results.push(name + ': OK ' + t.slice(0, 40)))
    .catch(() => results.push(name + ': BLOCKED')))).then(() => {
  const img = new Image();
  img.onload = img.onerror = () => {
    results.sort();
    document.getElementById('out').textContent = 'PROBE-DONE ' + results.join(' / ');
  };
  img.src = 'http://127.0.0.1:{{OTHER_PORT}}/pixel.png';
});
</script>
</body></html>
