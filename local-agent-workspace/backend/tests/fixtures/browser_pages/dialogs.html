<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Dialogs</title></head>
<body>
<h1>Dialogs</h1>
<p id="out">ready</p>
<button id="alert" onclick="alert('hello alert'); document.getElementById('out').textContent = 'after-alert'">Alert</button>
<button id="confirm" onclick="const r = confirm('really?'); document.getElementById('out').textContent = 'confirm=' + r">Confirm</button>
<a id="leave" href="form.html">Leave</a>
<script>
window.addEventListener('beforeunload', (e) => { e.preventDefault(); e.returnValue = ''; });
</script>
</body></html>
