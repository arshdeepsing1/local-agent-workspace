<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sign in</title></head>
<body>
<h1>Sign in</h1>
<form onsubmit="return false">
  <label for="u">Username</label><input id="u" name="username" type="text">
  <label for="pw">Password</label><input id="pw" name="pw" type="password">
  <input id="otp" name="code" type="text" autocomplete="one-time-code" aria-label="Code">
  <label for="cc">Card number</label><input id="cc" name="field3" type="text">
  <input id="q" name="q" type="text" aria-label="Search">
  <button type="submit">Sign in</button>
</form>
</body></html>
