<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Navigation</title></head>
<body>
<h1>Navigation</h1>
<a id="link" href="http://other.example.test/landing.html">Other site</a>
<button id="script" onclick="location.href='http://other.example.test/script.html'">Go by script</button>
<button id="popup" onclick="window.open('http://other.example.test/popup.html')">Open a popup</button>
<a id="local" href="http://127.0.0.1:{{OTHER_PORT}}/form.html">Local server</a>
<a id="same" href="/form.html">Same site</a>
<a id="redirect" href="/redirect?to=http%3A%2F%2Fother.example.test%2Fredirected.html">Redirected link</a>
</body></html>
